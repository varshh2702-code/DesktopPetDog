name: Corrected Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore DesktopPetDog.sln
      - name: Test
        run: dotnet test DesktopPetDog.sln -c Release --no-restore
      - name: Publish application
        run: dotnet publish src/DesktopPetDog/DesktopPetDog.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: powershell
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DesktopPetDog.iss
      - name: Verify installer exists
        shell: powershell
        run: |
          $installer = Get-Item "artifacts/DesktopPetDog-Setup.exe" -ErrorAction SilentlyContinue
          if (-not $installer) { throw "Installer was not created." }
          Write-Host "Installer: $($installer.FullName)"
      - name: Upload corrected installer
        uses: actions/upload-artifact@v4
        with:
          name: DesktopPetDog-Corrected-Installer
          path: artifacts/DesktopPetDog-Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish stable download
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view corrected-v1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create corrected-v1 --title "Desktop Pet Dog - Corrected Installer" --notes "Corrected Windows installer. Automated tests and installer verification completed before publishing."
          }
          gh release upload corrected-v1 artifacts/DesktopPetDog-Setup.exe --clobber
